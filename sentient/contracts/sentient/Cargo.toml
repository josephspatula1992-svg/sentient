[package]
name = "sentient"
version = "1.0.0"
edition = "2021"
rust-version = "1.86"
description = "Sentient: every NFT is a NEAR sub-account with an autonomous agent that earns, spends, duels, breeds and can die"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.9.0"

[dev-dependencies]
near-sdk = { version = "=5.9.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
